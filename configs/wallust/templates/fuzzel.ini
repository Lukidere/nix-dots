# Generated by wallust for fuzzel (bemoji emoji picker backend)
[main]
font=Iosevka Nerd Font:size=16
prompt=" "
horizontal-pad=20
vertical-pad=16
inner-pad=10
lines=8
width=32

[colors]
# strip removes the leading '#'; fuzzel wants RRGGBBAA
background={{background | strip}}f2
text={{foreground | strip}}ff
prompt={{color4 | strip}}ff
placeholder={{color8 | strip}}ff
input={{foreground | strip}}ff
match={{color4 | strip}}ff
selection={{color4 | strip}}ff
selection-text={{background | strip}}ff
selection-match={{color6 | strip}}ff
counter={{color8 | strip}}ff
border={{color4 | strip}}ff

[border]
width=2
radius=12
